name: CI (offline tests)

# Runs the FC26 offline test suite on every push/PR. No GCP credentials and no
# live model calls are configured here (FR-021) — the suite must be fully
# deterministic against mocks and fixtures.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Offline pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run offline test suite (no GCP creds, no live models)
        env:
          GOOGLE_API_KEY: ""
          GEMINI_API_KEY: ""
          WATSON_NLU_API_KEY: ""
          WATSON_NLU_URL: ""
          GOOGLE_APPLICATION_CREDENTIALS: ""
        run: python -m pytest -q
