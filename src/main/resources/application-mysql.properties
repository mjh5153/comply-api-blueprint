# MySQL profile: activate with --spring.profiles.active=mysql
# Credentials are read from environment variables so nothing sensitive
# is committed to source control.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

