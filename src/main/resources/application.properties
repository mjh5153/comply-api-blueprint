spring.application.name=comply-api-blueprint

# --- Default datasource: in-memory H2 -----------------------------------
spring.datasource.url=jdbc:h2:mem:complydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# --- Web / logging ------------------------------------------------------
# Uses $PORT if set (Render, Heroku, Cloud Run all inject it), falls back to 8080 locally.
server.port=${PORT:8080}
logging.level.org.springframework=INFO
