spring.application.name=comply-api-blueprint

# --- Datasource ---------------------------------------------------------
# Driver and Hibernate dialect are both inferred from the JDBC URL, so a
# single set of properties covers H2 and Postgres.
#
# Default (no env vars set): in-memory H2, so `mvn spring-boot:run` and the
# test suite need no external database. Data is discarded on exit.
#
# Postgres: set all three env vars, e.g. against a local instance
#   export SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/complydb
#   export SPRING_DATASOURCE_USERNAME=comply
#   export SPRING_DATASOURCE_PASSWORD=comply
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:complydb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate mutates the schema on boot. Adequate for a prototype; a real
# deployment wants versioned migrations (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Log the datasource actually in use, so a silent fall back to H2 in a
# deployed environment is visible in the startup logs.
logging.level.org.hibernate.orm.connections.pooling=INFO

# --- Web / logging ------------------------------------------------------
# Uses $PORT if set (Render, Heroku, Cloud Run all inject it), falls back to 8080 locally.
server.port=${PORT:8080}
logging.level.org.springframework=INFO
